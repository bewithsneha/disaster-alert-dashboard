services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
    volumes:
      - ./backend/alerts.db:/app/alerts.db

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
